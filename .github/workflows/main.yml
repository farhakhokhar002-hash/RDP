name: RDP Connection

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    env:
      TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}

    steps:
      - name: Test RDP Connection
        shell: powershell
        run: |
          Write-Host "=== Testing RDP Connectivity ==="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
              Write-Error "TAILSCALE_IP is not configured."
              exit 1
          }

          Write-Host "Testing TCP connection to $env:TAILSCALE_IP on port 3389..."

          $testResult = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "=================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP connection check active."
              Start-Sleep -Seconds 300
          }
